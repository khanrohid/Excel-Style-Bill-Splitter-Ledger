<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bill Ledger</title>
<style>
:root{--bg:#f1f5ec;--paper:#fff;--ink:#1c2a24;--mut:#6a7a71;--line:#cdd8cf;--hd:#1d6b4f;--hdt:#fff;--g:#1b8a4b;--r:#c0392b;--acc:#e8f1e6}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--paper:#1a2520;--ink:#e6efe9;--mut:#91a39a;--line:#2f4037;--hd:#2b8a66;--acc:#22322b;--g:#4cc884;--r:#ff7a6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px 10px 80px}
h1{font-size:20px;margin:6px 2px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--hd);color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:600}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:active{opacity:.7}
select,input[type=date],input[type=number],input[type=text]{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{display:flex;align-items:center;background:var(--acc);border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 12px;gap:2px}
.pill button{background:none;border:0;padding:4px 7px;color:var(--mut);font-size:14px}
.pill button.d{color:var(--r)}
.empty{color:var(--mut);padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
th{background:var(--hd);color:var(--hdt);position:sticky;top:0;white-space:nowrap}
td.d{min-width:150px}td.a{min-width:130px}td.p{min-width:120px}td.pc{min-width:100px}
.dl{display:flex;gap:4px;align-items:center}
.dl input{width:128px}
.x{background:none;border:0;color:var(--r);font-size:13px;padding:2px 4px;font-weight:700}
.it{height:36px;display:flex;align-items:center;gap:4px}
.amt{position:relative;width:104px}
.amt input{width:100%;padding-right:24px}
.amt .x{position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--mut)}
.ln{height:36px;display:flex;align-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.g{color:var(--g)}.r{color:var(--r)}.z{color:var(--mut)}
hr{border:0;border-top:2px solid var(--ink);margin:2px 0 4px}
.tot{font-weight:700;font-variant-numeric:tabular-nums}
.addamt{background:none;border:1px dashed var(--line);border-radius:6px;padding:4px 8px;color:var(--hd);font-weight:600;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.card{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:8px;padding:10px}
.card.g{border-left-color:var(--g)}.card.r{border-left-color:var(--r)}
.card b{display:block}.card small{color:var(--mut)}.card .v{font-size:18px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.md{background:var(--paper);border-radius:12px;padding:18px;width:100%;max-width:340px}
.md h3{margin:0 0 10px}.md input{width:100%}.md .err{color:var(--r);min-height:18px;font-size:13px}
.md .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:10}
#toast.on{opacity:1}
</style></head><body>
<h1>Bill Ledger</h1>
<div class="bar"><button class="btn" id="addP">+ Add Person</button>
<select id="cur"><option>AED</option><option>PKR</option><option>USD</option><option>EUR</option></select></div>
<div class="pills" id="pills"></div>
<div id="tbl"></div>
<div class="bar" style="margin-top:10px"><button class="btn" id="addD">+ Add Date</button></div>
<h1>Settlement summary</h1>
<div class="cards" id="cards"></div>
<div class="bar"><button class="btn" id="cp">Copy Text</button><button class="btn alt" id="pt">Save Table PNG</button><button class="btn alt" id="ps">Save Summary PNG</button></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
let S;try{S=JSON.parse(localStorage.getItem('billLedger1'))}catch(e){}
S=S||{people:[],rows:[],cur:'AED'};
const save=()=>{try{localStorage.setItem('billLedger1',JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const newItem=()=>({id:uid(),amt:'',by:'none'});
const pname=id=>id==='none'?'No One':(S.people.find(p=>p.id===id)||{name:'No One'}).name;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function modal({title,input,val,ok,danger,msg,onOk}){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md"><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:''}${input?`<input type="text" maxlength="30" placeholder="Name" value="${esc(val||'')}">`:''}<div class="err"></div><div class="row"><button class="btn alt c">Cancel</button><button class="btn o" ${danger?'style="background:var(--r)"':''}>${esc(ok)}</button></div></div>`;
 document.body.appendChild(o);const i=o.querySelector('input'),e=o.querySelector('.err');
 if(i){i.focus();i.select()}
 const go=()=>{const r=onOk(i?i.value.trim():null);if(r){e.textContent=r}else o.remove()};
 o.querySelector('.c').onclick=()=>o.remove();o.querySelector('.o').onclick=go;
 if(i)i.onkeydown=ev=>{if(ev.key==='Enter')go()};
}
function nameCheck(v,skip){if(!v)return'Enter a name.';if(S.people.some(p=>p.id!==skip&&p.name.toLowerCase()===v.toLowerCase()))return'That name is already used.';return''}
function calc(row,pid){const n=S.people.length;let lines=[],net=0;
 for(const it of row.items){const a=parseFloat(it.amt)||0;if(!a){lines.push(0);continue}
  const v=it.by===pid?a-a/n:-a/n;lines.push(v);net+=v}
 return{lines,net}}
function balances(){const b={};S.people.forEach(p=>b[p.id]=0);S.rows.forEach(r=>S.people.forEach(p=>b[p.id]+=calc(r,p.id).net));return b}
function cellHTML(r,p){const c=calc(r,p.id);
 const l=c.lines.map(v=>v?`<div class="ln ${v>0?'g':'r'}">${v>0?'+':'−'}${fmt(Math.abs(v))}</div>`:`<div class="ln z">·</div>`).join('');
 const t=c.net===0?'z':c.net>0?'g':'r';
 return l+`<hr><div class="tot ${t}">${c.net>0?'+':c.net<0?'−':''}${fmt(Math.abs(c.net))}</div>`}
function renderPills(){
 $('#pills').innerHTML=S.people.map(p=>`<div class="pill"><span>${esc(p.name)}</span><button data-ren="${p.id}" aria-label="Rename">✎</button><button class="d" data-del="${p.id}" aria-label="Delete">✕</button></div>`).join('')||'<div class="empty" style="width:100%">No members yet. Tap + Add Person to start.</div>'}
function renderTable(){
 if(!S.people.length&&!S.rows.length){$('#tbl').innerHTML='';return}
 const sel=(it)=>`<select data-by="${it.id}"><option value="none"${it.by==='none'?' selected':''}>No One</option>${S.people.map(p=>`<option value="${p.id}"${it.by===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
 const rows=S.rows.map(r=>`<tr data-r="${r.id}"><td class="d"><div class="dl"><input type="date" value="${r.date}" data-date="${r.id}"><button class="x" data-rd="${r.id}" aria-label="Delete date">✕</button></div></td>
 <td class="a">${r.items.map(it=>`<div class="it"><div class="amt"><input type="number" inputmode="decimal" step="any" min="0" placeholder="0.00" value="${esc(it.amt)}" data-amt="${it.id}"><button class="x" data-clr="${it.id}" aria-label="Clear">✕</button></div></div>`).join('')}<button class="addamt" data-ai="${r.id}">+ Add Amount</button></td>
 <td class="p">${r.items.map(it=>`<div class="it">${sel(it)}${r.items.length>1?`<button class="x" data-ri="${it.id}" aria-label="Remove amount">−</button>`:''}</div>`).join('')}</td>
 ${S.people.map(p=>`<td class="pc" id="c-${r.id}-${p.id}">${cellHTML(r,p)}</td>`).join('')}</tr>`).join('');
 $('#tbl').innerHTML=`<div class="wrap"><table><thead><tr><th>Date &amp; Action</th><th>Amounts on Date</th><th>Paid By</th>${S.people.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
 if(!S.rows.length)$('#tbl').innerHTML+=''}
function renderCalc(){S.rows.forEach(r=>S.people.forEach(p=>{const c=document.getElementById(`c-${r.id}-${p.id}`);if(c)c.innerHTML=cellHTML(r,p)}));renderCards()}
function renderCards(){const b=balances();
 $('#cards').innerHTML=S.people.map(p=>{const v=b[p.id];const k=Math.abs(v)<.005?'':v>0?'g':'r';
 return`<div class="card ${k}"><b>${esc(p.name)}</b><small>${k==='g'?'Gets back':k==='r'?'Owes':'Settled'}</small><div class="v ${k}">${k?fmt(Math.abs(v)):'0.00'} <small>${S.cur}</small></div></div>`}).join('')||'<div class="empty" style="grid-column:1/-1">Add people to see balances.</div>'}
function render(){save();renderPills();renderTable();renderCards();$('#cur').value=S.cur}
const findItem=id=>{for(const r of S.rows){const it=r.items.find(i=>i.id===id);if(it)return[r,it]}return[]};
$('#addP').onclick=()=>modal({title:'Add person',input:1,ok:'Add',onOk:v=>{const e=nameCheck(v);if(e)return e;S.people.push({id:uid(),name:v});render()}});
$('#addD').onclick=()=>{S.rows.push({id:uid(),date:today(),items:[newItem()]});render()};
$('#cur').onchange=e=>{S.cur=e.target.value;save();renderCards()};
$('#pills').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.ren){const p=S.people.find(x=>x.id===b.dataset.ren);modal({title:'Rename person',input:1,val:p.name,ok:'Save',onOk:v=>{const er=nameCheck(v,p.id);if(er)return er;p.name=v;render()}})}
 if(b.dataset.del){const p=S.people.find(x=>x.id===b.dataset.del);modal({title:'Delete '+p.name+'?',msg:'Their column is removed and their bills become "No One".',ok:'Delete',danger:1,onOk:()=>{S.people=S.people.filter(x=>x.id!==p.id);S.rows.forEach(r=>r.items.forEach(i=>{if(i.by===p.id)i.by='none'}));render()}})}};
$('#tbl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.rd){modal({title:'Delete this date?',ok:'Delete',danger:1,onOk:()=>{S.rows=S.rows.filter(r=>r.id!==d.rd);render()}})}
 else if(d.ai){S.rows.find(r=>r.id===d.ai).items.push(newItem());render()}
 else if(d.ri){const[r]=findItem(d.ri);r.items=r.items.filter(i=>i.id!==d.ri);render()}
 else if(d.clr){const[,it]=findItem(d.clr);it.amt='';b.parentNode.querySelector('input').value='';save();renderCalc()}});
$('#tbl').addEventListener('input',e=>{const t=e.target;
 if(t.dataset.amt){const[,it]=findItem(t.dataset.amt);it.amt=t.value;save();renderCalc()}
 else if(t.dataset.date){S.rows.find(r=>r.id===t.dataset.date).date=t.value;save()}});
$('#tbl').addEventListener('change',e=>{const t=e.target;if(t.dataset.by){const[,it]=findItem(t.dataset.by);it.by=t.value;save();renderCalc()}});
/* export */
function summaryText(){const b=balances();return`Bill Summary (${S.cur})\n`+S.people.map(p=>{const v=b[p.id];return Math.abs(v)<.005?`${p.name}: Settled`:v>0?`${p.name}: Gets back ${fmt(v)}`:`${p.name}: Owes ${fmt(-v)}`}).join('\n')}
$('#cp').onclick=async()=>{const t=summaryText();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('Summary copied')};
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-family="Arial,sans-serif" font-size="${o.s||14}" font-weight="${o.w||400}" fill="${o.c||'#1c2a24'}" text-anchor="${o.a||'start'}">${esc(s)}</text>`;
function tableSVG(){const W0=[110,110,110],cw=110,n=S.people.length,W=W0.reduce((a,b)=>a+b)+n*cw+2,L=22;
 let y=34,o=`<rect width="${W}" height="@H" fill="#fff"/><rect y="0" width="${W}" height="34" fill="#1d6b4f"/>`;
 const hs=['Date','Amounts','Paid By',...S.people.map(p=>p.name)];let x=0;const xs=[];
 hs.forEach((h,i)=>{xs.push(x);o+=T(x+8,22,h,{w:700,c:'#fff'});x+=i<3?W0[i]:cw});
 S.rows.forEach(r=>{const h=r.items.length*L+34;o+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#cdd8cf"/>`;
  o+=T(8,y+17,r.date,{w:700});
  r.items.forEach((it,k)=>{const yy=y+17+k*L;o+=T(xs[1]+8,yy,fmt(parseFloat(it.amt)||0))+T(xs[2]+8,yy,pname(it.by),{s:13})});
  S.people.forEach((p,pi)=>{const c=calc(r,p.id),px=xs[3+pi]+8;
   c.lines.forEach((v,k)=>{o+=v?T(px,y+17+k*L,(v>0?'+':'-')+fmt(Math.abs(v)),{c:v>0?'#1b8a4b':'#c0392b',w:600}):T(px,y+17+k*L,'·',{c:'#6a7a71'})});
   const ly=y+r.items.length*L+2;o+=`<line x1="${px}" x2="${px+cw-16}" y1="${ly}" y2="${ly}" stroke="#1c2a24" stroke-width="2"/>`+T(px,ly+18,(c.net>0?'+':c.net<0?'-':'')+fmt(Math.abs(c.net)),{w:700,c:c.net>0?'#1b8a4b':c.net<0?'#c0392b':'#6a7a71'})});
  y+=h});
 o+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#cdd8cf"/>`;
 return{W,H:y+1,svg:o.replace('@H',y+1)}}
function summarySVG(){const b=balances(),W=420,H=70+S.people.length*50;let o=`<rect width="${W}" height="${H}" fill="#fff"/>`+T(16,32,'Settlement Summary ('+S.cur+')',{s:18,w:700});
 S.people.forEach((p,i)=>{const v=b[p.id],y=50+i*50,k=Math.abs(v)<.005?0:v>0?1:-1,c=k>0?'#1b8a4b':k<0?'#c0392b':'#6a7a71';
  o+=`<rect x="16" y="${y}" width="${W-32}" height="42" rx="8" fill="#f1f5ec"/><rect x="16" y="${y}" width="5" height="42" fill="${c}"/>`+T(32,y+26,p.name,{w:700,s:15})+T(W-28,y+26,k>0?'Gets back '+fmt(v):k<0?'Owes '+fmt(-v):'Settled',{a:'end',c,w:700,s:15})});
 return{W,H,svg:o}}
function exportPNG(g,name){if(!S.people.length&&!S.rows.length){toast('Nothing to save yet');return}
 const{W,H,svg}=g(),full=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
 const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0);
  c.toBlob(async bl=>{const f=new File([bl],name,{type:'image/png'});
   try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
   const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('PNG saved')},'image/png')};
 img.onerror=()=>toast('Could not render PNG');
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(full)}
$('#pt').onclick=()=>exportPNG(tableSVG,'bill-table.png');
$('#ps').onclick=()=>exportPNG(summarySVG,'bill-summary.png');
render();
</script></body></html>
